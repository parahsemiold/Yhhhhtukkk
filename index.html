body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 25%,rgba(25,226,255,.16),transparent 38%)}
.wrap{width:min(100% - 28px,900px);margin:auto;padding:22px 0 55px}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 17px;border:1px solid rgba(255,255,255,.055);
  background:rgba(4,13,22,.56);backdrop-filter:blur(16px);border-radius:22px;
  box-shadow:0 15px 45px rgba(0,0,0,.35);animation:drop .7s ease both;
}
.brand{font-size:22px;font-weight:900;letter-spacing:.5px}.brand span{color:var(--cyan)}
.badge{font-size:11px;color:#b9f8ff;border:1px solid rgba(37,231,255,.35);padding:7px 10px;border-radius:999px}
.hero{text-align:center;padding:35px 12px 20px;animation:fade .9s ease both}
.hero h1{font-size:clamp(29px,8vw,48px);margin:0 0 8px;text-shadow:0 0 25px rgba(37,231,255,.35)}
.hero p{margin:0;color:#c9d9df}
.card{
  background:var(--glass);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(18px);
  border-radius:25px;padding:20px;box-shadow:0 20px 55px rgba(0,0,0,.42);
  animation:up .7s .1s ease both;
}
label{display:block;font-size:13px;color:#bdeaf0;margin:0 0 8px}
.field{margin-bottom:16px}
input,textarea,select{
  width:100%;border:1px solid rgba(255,255,255,.06);outline:0;
  border-radius:15px;padding:14px 15px;background:rgba(0,0,0,.35);color:#fff;
  font-size:15px;transition:.25s;
}
select option{background:#09141d;color:#fff}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,231,255,.1),0 0 22px rgba(37,231,255,.12)}
button{font:inherit;border:0;cursor:pointer}
.send{
  width:100%;padding:16px;border-radius:16px;color:#001017;font-weight:900;
  background:linear-gradient(135deg,#52f2ff,#168cff);box-shadow:0 8px 25px rgba(37,231,255,.25);
  transition:.25s;position:relative;overflow:hidden
}
.send:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(37,231,255,.35)}
.send:active{transform:scale(.98)}
.send:after{content:"";position:absolute;top:0;left:-100%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
.manager{margin-top:18px}
.manager-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.manager-head h2{font-size:17px;margin:0}
.small{font-size:12px;color:#a8bdc5}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.action{
  padding:10px 12px;border-radius:12px;color:#fff;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.045);transition:.2s
}
.action:hover{background:rgba(37,231,255,.14);border-color:rgba(37,231,255,.4)}
.products{display:grid;gap:9px;margin-top:12px}
.product{
  display:flex;align-items:center;gap:10px;padding:12px;border-radius:15px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.04);
  cursor:grab;transition:.2s;animation:pop .35s ease both;
}
.product:active{cursor:grabbing}.product.dragging{opacity:.35;transform:scale(.98)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 13px var(--cyan);flex:none}
.product-name{flex:1;font-weight:700}
.delete{padding:7px 9px;border-radius:10px;background:rgba(255,70,80,.12);color:#ff9da3;border:1px solid rgba(255,70,80,.2)}
.empty{text-align:center;padding:18px;color:#8da2aa;font-size:13px}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;
  align-items:center;justify-content:center;padding:18px;z-index:10
}
.modal.show{display:flex}
.modal-box{width:min(100%,420px);background:#08141e;border:1px solid rgba(255,255,255,.055);border-radius:22px;padding:20px;animation:pop .25s ease}
.modal-box h3{margin:0 0 15px}.modal-buttons{display:flex;gap:9px;margin-top:12px}.modal-buttons button{flex:1;padding:12px;border-radius:12px}
.ok{background:var(--cyan);color:#001017;font-weight:800}.cancel{background:#16232d;color:#fff}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;z-index:20;background:#08141e;border:1px solid rgba(37,231,255,.35);padding:12px 16px;border-radius:13px;transition:.3s;box-shadow:0 10px 30px #0008}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shine{0%,65%{left:-100%}90%,100%{left:150%}}
@media(max-width:560px){.wrap{width:min(100% - 18px,900px);padding-top:10px}.card{padding:16px;border-radius:21px}.hero{padding:28px 8px 17px}.hero p{font-size:13px}header{border-radius:18px}}
</style>
</head>
<body>
<div class="wrap">
<header><div></div><div class="badge">ORDER SYSTEM</div></header>

<section class="hero">
  <h1>Kirim Pesanan</h1>
  <p>Pilih produk, masukkan nomor WhatsApp, lalu kirim pesanan.</p>
</section>

<main class="card">
  <div class="field">
    <label>1. Pilih nama produk</label>
    <select id="productSelect"></select>
  </div>

  <div class="field">
    <label>2. Masukkan nomor WhatsApp</label>
    <input id="phone" inputmode="tel" placeholder="Contoh: 628123456789" autocomplete="tel">
  </div>

  <div class="field">
    <label>3. Masukkan pesan</label>
    <textarea id="message" placeholder="Tulis pesan pesanan kamu..."></textarea>
  </div>

  <button class="send" id="sendBtn">KIRIM PESANAN → WHATSAPP</button>

  <section class="manager">
    <div class="manager-head">
      <div><h2>Kelola Produk</h2><div class="small">Tekan & tahan lalu geser untuk mengubah urutan.</div></div>
      <div class="actions">
        <button class="action" id="addBtn">＋ Tambah</button>
        <button class="action" id="resetBtn">↺ Reset</button>
      </div>
    </div>
    <div class="products" id="products"></div>
  </section>
</main>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3>Tambah Produk</h3>
    <div class="field"><label>Nama</label><input id="newProduct" placeholder="Nama produk"></div>
    <div class="field"><label>Link</label><input id="newLink" type="url" placeholder="https://contoh.com/produk"></div>
    <div class="modal-buttons"><button class="cancel" id="cancelBtn">Batal</button><button class="ok" id="saveBtn">Tambah</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const defaultProducts = [
  { name: "Produk Premium", link: "https://example.com" },
  { name: "Aplikasi Premium", link: "https://example.com" },
  { name: "Jasa Digital", link: "https://example.com" }
];

const $ = id => document.getElementById(id);
let products = JSON.parse(localStorage.getItem("dulz_products") || "null") || defaultProducts;

// Kompatibel dengan data produk versi lama.
products = Array.isArray(products)
  ? products.map(p => typeof p === "string" ? {name:p, link:""} : {
      name: String(p.name || "").trim(),
      link: String(p.link || "").trim()
    }).filter(p => p.name)
  : defaultProducts.map(p => ({...p}));

let draggedIndex = null;

function save() {
  localStorage.setItem("dulz_products", JSON.stringify(products));
  render();
}

function render() {
  const sel = $("productSelect");
  const list = $("products");

  sel.innerHTML = "";

  if (!products.length) {
    sel.innerHTML = '<option value="">Belum ada produk</option>';
  } else {
    products.forEach((p, i) => {
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = p.name;
      sel.appendChild(option);
    });
  }

  list.innerHTML = "";

  if (!products.length) {
    list.innerHTML = '<div class="empty">Belum ada produk. Tekan ＋ Tambah.</div>';
    return;
  }

  products.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "product";
    el.draggable = true;
    el.dataset.i = String(i);

    el.innerHTML =
      '<span class="dot"></span>' +
      '<span class="product-name"></span>' +
      '<button class="delete" type="button">Hapus</button>';

    const nameEl = el.querySelector(".product-name");
    nameEl.textContent = p.name + (p.link ? " • " + p.link : "");

    el.querySelector(".delete").addEventListener("click", e => {
      e.stopPropagation();
      if (confirm('Hapus produk "' + p.name + '"?')) {
        products.splice(i, 1);
        save();
        toast("Produk dihapus");
      }
    });

    el.addEventListener("dragstart", () => {
      draggedIndex = i;
      el.classList.add("dragging");
    });

    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      draggedIndex = null;
    });

    el.addEventListener("dragover", e => e.preventDefault());

    el.addEventListener("drop", e => {
      e.preventDefault();
      const to = i;
      if (draggedIndex === null || draggedIndex === to) return;

      const moved = products.splice(draggedIndex, 1)[0];
      products.splice(to, 0, moved);
      save();
      toast("Urutan produk diubah");
    });

    list.appendChild(el);
  });
}

function toast(message) {
  const box = $("toast");
  box.textContent = message;
  box.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => box.classList.remove("show"), 2200);
}

$("addBtn").addEventListener("click", () => {
  $("modal").classList.add("show");
  $("newProduct").value = "";
  $("newLink").value = "";
  setTimeout(() => $("newProduct").focus(), 100);
});

$("cancelBtn").addEventListener("click", () => {
  $("modal").classList.remove("show");
});

$("modal").addEventListener("click", e => {
  if (e.target === $("modal")) $("modal").classList.remove("show");
});

$("saveBtn").addEventListener("click", () => {
  const name = $("newProduct").value.trim();
  let link = $("newLink").value.trim();

  if (!name) {
    toast("Masukkan nama produk");
    return;
  }

  if (link && !/^https?:\/\//i.test(link)) {
    link = "https://" + link;
  }

  products.push({name, link});
  save();

  $("modal").classList.remove("show");
  $("productSelect").value = String(products.length - 1);
  toast("Produk berhasil ditambahkan");
});

$("resetBtn").addEventListener("click", () => {
  if (confirm("Kembalikan daftar produk ke awal?")) {
    products = defaultProducts.map(p => ({...p}));
    save();
    toast("Produk di-reset");
  }
});

function normalizeWhatsAppNumber(value) {
  let phone = value.replace(/\D/g, "");

  if (phone.startsWith("0")) {
    phone = "62" + phone.slice(1);
  } else if (phone.startsWith("8")) {
    phone = "62" + phone;
  }

  return phone;
}

$("sendBtn").addEventListener("click", () => {
  const index = Number($("productSelect").value);
  const selected = products[index];
  const phone = normalizeWhatsAppNumber($("phone").value);
  const message = $("message").value.trim();

  if (!selected) {
    toast("Pilih produk dulu");
    return;
  }

  if (phone.length < 10) {
    toast("Nomor WhatsApp belum benar");
    return;
  }

  let text =
    "Halo, saya ingin memesan:\n\n" +
    "Produk: " + selected.name + "\n" +
    "Pesan: " + (message || "-");

  if (selected.link) {
    text += "\nLink Produk: " + selected.link;
  }

  const waUrl = "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);
  window.open(waUrl, "_blank");
});

$("phone").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/[^\d+ ]/g, "");
});

render();
</script>
</body>
</html>
